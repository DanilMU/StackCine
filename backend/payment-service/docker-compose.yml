version: '3.9'

services:
    payment-service:
        container_name: payment-service
        image: stackcine/payment-service:dev
        build:
            context: .
            dockerfile: Dockerfile
        restart: always
        ports:
            - "50057:50057"
        env_file:
            - .env.production.local
        networks:
            - stackcine

networks:
    stackcine:
        external: true
