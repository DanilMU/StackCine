version: '3.9'

services:
    booking-service:
        container_name: booking-service
        image: stackcine/booking-service:dev
        build:
            context: .
            dockerfile: Dockerfile
        restart: always
        ports:
            - '50058:50058'
        env_file:
            - .env.production.local
        networks:
            - stackcine

networks:
    stackcine:
        external: true
