version: '3.9'

services:
    screening-service:
        container_name: screening-service
        image: stackcine/screening-service:dev
        build:
            context: .
            dockerfile: Dockerfile
        restart: always
        ports:
            - "50056:50056"
        env_file:
            - .env.production.local
        networks:
            - stackcine

networks:
    stackcine:
        external: true
