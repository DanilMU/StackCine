version: '3.9'

services:
      auth-service:
            container_name: auth-service
            image: stackcine/auth-service:dev
            build:
                  context: .
                  dockerfile: Dockerfile
            restart: always
            env_file:
                  - .env.production.local
            networks:
                  - stackcine

networks:
      stackcine:
            external: true
